# Render Blueprint: free web service running the EventControl Docker image.
# Database and files live in Supabase (free), because free Render instances have no
# persistent disk. See README → "Free cloud hosting (Render + Supabase)".
services:
  - type: web
    name: eventcontrol
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # Supabase → Connect → "Session pooler" URI
        sync: false
      - key: SUPABASE_URL          # Supabase → Project Settings → API → Project URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: eventcontrol
      - key: GOOGLE_CLIENT_ID      # optional: Google Drive import (README → Google Drive)
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ALLOWED_EMAILS # optional: "Sign in with Google" for these accounts
        sync: false
